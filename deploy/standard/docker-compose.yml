services:
  api:
    image: ghcr.io/bedrock-python/mr-review/api:latest
    restart: unless-stopped
    ports:
      - "${API_PORT:-17241}:8000"
    environment:
      MR_REVIEW__SERVER__HOST: "0.0.0.0"
      MR_REVIEW__SERVER__PORT: "8000"
      MR_REVIEW__DATA_DIR: "/data"
      MR_REVIEW__HOST_DATA_DIR: "${DATA_DIR:-./data}"
      MR_REVIEW__LOGGING__USE_JSON: "true"
      # The container starts as root, gives the data directory to PUID:PGID
      # and runs the application as that user.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ${DATA_DIR:-./data}:/data
    networks:
      - mr-review
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/system/health/livez"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    image: ghcr.io/bedrock-python/mr-review/web-app:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-17242}:8080"
    environment:
      # The UI calls /api/ on its own origin and nginx in this container
      # forwards it to the api service, so the UI works from any hostname or
      # address and the API needs no CORS settings.
      API_UPSTREAM: "http://api:8000"
      APP_ENV: "production"
    networks:
      - mr-review
    depends_on:
      api:
        condition: service_healthy

networks:
  mr-review:
    driver: bridge
