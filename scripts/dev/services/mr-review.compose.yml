services:
  mr-review-api:
    build:
      context: ../../services/mr-review
      dockerfile: Dockerfile.api
      target: production
    profiles: [mr-review, all]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MR_REVIEW__DATA_DIR: "/data"
    volumes:
      - mr-review-data:/data
    networks:
      - mr-review-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/system/health/livez"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mr-review-data:

networks:
  mr-review-network:
    external: true
