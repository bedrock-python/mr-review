services:
  mr-review-web:
    build:
      context: ../../services/web-app
      dockerfile: Dockerfile.app
      target: production
    profiles: [web-app, all]
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      API_UPSTREAM: "http://mr-review-api:8000"
    networks:
      - mr-review-network
    restart: unless-stopped
    depends_on:
      mr-review-api:
        condition: service_healthy

networks:
  mr-review-network:
    external: true
